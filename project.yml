name: YiBuDa

options:
  bundleIdPrefix: com.zhenkaikai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  YiBuDa:
    type: application
    platform: iOS
    sources:
      - YiBuDa
      - Shared
    dependencies:
      - target: YiBuDaLiveActivity
    info:
      path: YiBuDa/Info.plist
      properties:
        CFBundleDisplayName: 一步搭
        CFBundleDevelopmentRegion: zh-Hant
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: 導航時需要你的位置，用來指引步行方向、確認站牌和提醒下車。行程結束後就會停止使用。
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhenkaikai.yibuda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  YiBuDaLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - YiBuDaLiveActivity
      - Shared
    info:
      path: YiBuDaLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: 一步搭即時動態
        CFBundleDevelopmentRegion: zh-Hant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhenkaikai.yibuda.LiveActivity

  YiBuDaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YiBuDaTests
    dependencies:
      - target: YiBuDa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhenkaikai.yibuda.tests
        GENERATE_INFOPLIST_FILE: YES

  YiBuDaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YiBuDaUITests
    dependencies:
      - target: YiBuDa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhenkaikai.yibuda.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YiBuDa

schemes:
  YiBuDa:
    build:
      targets:
        YiBuDa: all
        YiBuDaTests: [test]
        YiBuDaUITests: [test]
    test:
      targets:
        - YiBuDaTests
        - YiBuDaUITests
